<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f6f9f7"/><stop offset="1" stop-color="#e5efeb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#244a41" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#4f8075"/></marker>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="70" y="72" font-size="34" font-weight="700" fill="#173b34">文章实时预览的数据流</text>
    <text x="72" y="108" font-size="17" fill="#5b756e">编辑器不另造一套 Markdown 规则，而是直接复用博客正在使用的 Aether 渲染器</text>
    <g filter="url(#shadow)">
      <rect x="70" y="190" width="230" height="170" rx="18" fill="#242a28"/>
      <rect x="370" y="190" width="230" height="170" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
      <rect x="670" y="190" width="230" height="170" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
      <rect x="970" y="190" width="360" height="170" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
    </g>
    <text x="185" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">Markdown 编辑区</text>
    <text x="485" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#173b34">请求调度</text>
    <text x="785" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#173b34">Node 本地服务</text>
    <text x="1150" y="240" text-anchor="middle" font-size="24" font-weight="700" fill="#173b34">隔离的正文预览</text>
    <g font-size="17">
      <text x="105" y="290" fill="#d4e6e0">工具栏插入语法</text><text x="105" y="324" fill="#d4e6e0">记录字数与光标</text>
      <text x="405" y="290" fill="#506b64">320 ms 防抖</text><text x="405" y="324" fill="#506b64">请求序号防止旧响应覆盖</text>
      <text x="705" y="290" fill="#506b64">POST /api/markdown/render</text><text x="705" y="324" fill="#506b64">hexo-renderer-aether</text>
      <text x="1010" y="290" fill="#506b64">改写本地素材地址</text><text x="1010" y="324" fill="#506b64">iframe srcdoc + sandbox</text>
    </g>
    <path d="M300 275 H370" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M600 275 H670" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M900 275 H970" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="185" y="475" width="1030" height="112" rx="20" fill="#167c68"/>
    <text x="700" y="520" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">每次重新渲染前记录预览滚动比例，载入完成后恢复到相近阅读位置</text>
    <text x="700" y="558" text-anchor="middle" font-size="17" fill="#d9f1ea">编辑区与预览区既可以独立滚动，也可以按阅读进度双向同步</text>
  </g>
</svg>
