<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f8f6"/><stop offset="1" stop-color="#e5efeb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#244a41" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#4f8075"/></marker>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#173b34">本地博客管理台的整体架构</text>
  <text x="72" y="108" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#5b756e">管理台不替换 Hexo，而是把原本分散的操作集中到一个本地工作台</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="310" height="500" rx="18" fill="#242a28"/>
    <rect x="515" y="180" width="370" height="500" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
    <rect x="1020" y="180" width="310" height="500" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
  </g>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="225" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">管理台前端</text>
    <text x="700" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#173b34">Node 本地服务</text>
    <text x="1175" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#173b34">博客与远端</text>
    <g font-size="18">
      <text x="110" y="300" fill="#d4e6e0">概览与任务日志</text><text x="110" y="344" fill="#d4e6e0">文章与页面管理</text><text x="110" y="388" fill="#d4e6e0">素材与图床</text><text x="110" y="432" fill="#d4e6e0">Live2D 配置</text><text x="110" y="476" fill="#d4e6e0">Markdown 特效</text><text x="110" y="520" fill="#d4e6e0">构建、预览、部署</text>
      <text x="565" y="300" fill="#506b64">REST API</text><text x="565" y="344" fill="#506b64">输入校验</text><text x="565" y="388" fill="#506b64">原子写入</text><text x="565" y="432" fill="#506b64">写入前备份</text><text x="565" y="476" fill="#506b64">Hexo 子进程</text><text x="565" y="520" fill="#506b64">任务状态与日志</text>
      <text x="1070" y="300" fill="#506b64">source/ Markdown</text><text x="1070" y="344" fill="#506b64">_config.shokax.yml</text><text x="1070" y="388" fill="#506b64">public/ 静态站点</text><text x="1070" y="432" fill="#506b64">GitHub 图床</text><text x="1070" y="476" fill="#506b64">Algolia / Waline</text><text x="1070" y="520" fill="#506b64">GitHub Pages</text>
    </g>
  </g>
  <path d="M380 420 H515" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M885 420 H1020" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="447" y="396" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#3d7569">fetch + REST</text>
  <text x="952" y="396" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#3d7569">读写文件 / 执行命令</text>
  <rect x="235" y="755" width="930" height="58" rx="29" fill="#167c68"/>
  <text x="700" y="793" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" font-weight="700" fill="#fff">本地优先 · 无数据库 · 不暴露密钥 · 每次写入可回退</text>
</svg>
