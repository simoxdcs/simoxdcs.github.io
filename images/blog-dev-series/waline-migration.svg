    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#3d7569"/></marker>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>
  <text x="60" y="68" font-family="Microsoft YaHei, sans-serif" font-size="31" font-weight="700" fill="#173b34">LeanCloud 评论迁移到 Waline</text>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <rect x="70" y="180" width="230" height="120" rx="16" fill="#fff" stroke="#bcd8cf" stroke-width="2"/><rect x="485" y="180" width="230" height="120" rx="16" fill="#fff" stroke="#bcd8cf" stroke-width="2"/><rect x="900" y="180" width="230" height="120" rx="16" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
    <text x="185" y="228" font-size="23" font-weight="700" fill="#173b34">LeanCloud</text><text x="185" y="263" font-size="16" fill="#617a72">导出评论数据</text>
    <text x="600" y="228" font-size="23" font-weight="700" fill="#173b34">转换与核对</text><text x="600" y="263" font-size="16" fill="#617a72">字段、时间、文章地址</text>
    <text x="1015" y="228" font-size="23" font-weight="700" fill="#173b34">Waline</text><text x="1015" y="263" font-size="16" fill="#617a72">导入并连接新主题</text>
