  <text x="600" y="416" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#fff">数据迁移成功 ≠ 页面显示成功，还要单独验证评论组件的渲染链路</text>
