<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f7f9f8"/><stop offset="1" stop-color="#e7efec"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#244a41" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#4f8075"/></marker>
  </defs>
  <rect width="1400" height="760" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, sans-serif">
    <text x="70" y="72" font-size="34" font-weight="700" fill="#173b34">图床提交与重新推送的状态判断</text>
    <text x="72" y="108" font-size="17" fill="#5b756e">工作区干净不等于没有待完成任务，必须同时检查本地分支是否领先远端</text>
    <g filter="url(#shadow)">
      <rect x="80" y="190" width="260" height="120" rx="18" fill="#242a28"/>
      <rect x="470" y="165" width="300" height="170" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
      <rect x="950" y="120" width="350" height="180" rx="18" fill="#fff" stroke="#bcd8cf" stroke-width="2"/>
      <rect x="950" y="390" width="350" height="150" rx="18" fill="#fff" stroke="#dfb96a" stroke-width="2"/>
      <rect x="470" y="450" width="300" height="120" rx="18" fill="#fff" stroke="#c7d3cf" stroke-width="2"/>
    </g>
    <text x="210" y="235" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">点击图床推送</text>
    <text x="210" y="275" text-anchor="middle" font-size="16" fill="#d4e6e0">读取图片变更与领先提交数</text>
    <text x="620" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#173b34">存在图片变更？</text>
    <text x="620" y="258" text-anchor="middle" font-size="16" fill="#506b64">git status --porcelain -z</text>
    <text x="620" y="292" text-anchor="middle" font-size="16" fill="#506b64">只提取受支持的图片路径</text>
    <text x="1125" y="170" text-anchor="middle" font-size="23" font-weight="700" fill="#173b34">正常提交路径</text>
    <text x="1125" y="213" text-anchor="middle" font-size="16" fill="#506b64">git add 指定图片</text>
    <text x="1125" y="247" text-anchor="middle" font-size="16" fill="#506b64">git commit -m "add files"</text>
    <text x="1125" y="281" text-anchor="middle" font-size="16" fill="#506b64">git push --progress</text>
    <text x="1125" y="438" text-anchor="middle" font-size="23" font-weight="700" fill="#8a5a16">重新推送路径</text>
    <text x="1125" y="478" text-anchor="middle" font-size="16" fill="#6f6048">跳过 add 与 commit</text>
    <text x="1125" y="512" text-anchor="middle" font-size="16" fill="#6f6048">直接重试 git push</text>
    <text x="620" y="495" text-anchor="middle" font-size="21" font-weight="700" fill="#173b34">领先远端提交数 &gt; 0？</text>
    <text x="620" y="535" text-anchor="middle" font-size="16" fill="#506b64">git rev-list --count @{upstream}..HEAD</text>
    <path d="M340 250 H470" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M770 220 H950" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M620 335 V450" stroke="#4f8075" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M770 510 H950" stroke="#b07b2e" stroke-width="5" marker-end="url(#arrow)"/>
    <text x="855" y="198" text-anchor="middle" font-size="17" fill="#3d7569">有</text>
    <text x="647" y="404" font-size="17" fill="#3d7569">没有</text>
    <text x="855" y="488" text-anchor="middle" font-size="17" fill="#8a5a16">有</text>
    <text x="620" y="650" text-anchor="middle" font-size="18" fill="#6f7975">两者都没有时按钮保持禁用，不制造空提交</text>
  </g>
</svg>
